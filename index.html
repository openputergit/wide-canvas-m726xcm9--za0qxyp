<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMI Data Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-gray-900 text-white p-4">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-2">
                <i class="bi bi-graph-up text-2xl"></i>
                <h1 class="text-xl font-bold">PMI Data - Manufacturing</h1>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <span>Currency: USD</span>
                    <i class="bi bi-caret-down-fill"></i>
                </div>
                <div class="text-gray-400">Feb 1, 2024 - Feb 10, 2025</div>
            </div>
        </div>

        <!-- Data Input Form -->
        <div class="bg-gray-800 p-4 rounded-lg mb-6">
            <h2 class="text-lg font-semibold mb-4">Enter Data</h2>
            <form id="dataForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block mb-2">Actual Data</label>
                    <input type="number" id="actualData" step="0.1" class="w-full bg-gray-700 rounded p-2" required>
                </div>
                <div>
                    <label class="block mb-2">Forecast Data</label>
                    <input type="number" id="forecastData" step="0.1" class="w-full bg-gray-700 rounded p-2" required>
                </div>
                <div>
                    <label class="block mb-2">Previous Data</label>
                    <input type="number" id="previousData" step="0.1" class="w-full bg-gray-700 rounded p-2" required>
                </div>
                <div>
                    <label class="block mb-2">Date</label>
                    <input type="date" id="dateInput" class="w-full bg-gray-700 rounded p-2" required>
                </div>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">Add Data</button>
            </form>
        </div>

        <!-- Chart Container -->
        <div class="bg-gray-800 p-4 rounded-lg">
            <canvas id="pmiChart"></canvas>
        </div>
    </div>

    <script>
        let chart;
        const ctx = document.getElementById('pmiChart').getContext('2d');
        
        // Initial data
        const initialData = {
            labels: ['Feb 1, 2024', 'Mar 1, 2024', 'Apr 1, 2024', 'May 1, 2024', 'Jun 3, 2024', 
                    'Jul 1, 2024', 'Aug 1, 2024', 'Sep 3, 2024', 'Oct 1, 2024', 'Nov 1, 2024', 
                    'Dec 2, 2024', 'Jan 3, 2025', 'Feb 3, 2025'],
            actualData: [49.1, 47.8, 50.3, 49.2, 48.7, 48.5, 46.8, 47.2, 47.2, 46.5, 48.4, 49.3, 50.9],
            forecastData: [49.1, 47.8, 50.3, 49.2, 48.7, 48.5, 46.8, 47.2, 47.2, 46.5, 48.4, 49.3, 50.9],
            previousData: [48.0, 47.0, 49.5, 48.8, 48.0, 48.0, 46.0, 46.8, 47.0, 46.0, 48.0, 49.0, 50.0]
        };

        function createChart(data) {
            if (chart) {
                chart.destroy();
            }

            chart = new Chart(ctx, {
                data: {
                    labels: data.labels,
                    datasets: [
                        {
                            label: 'Manufacturing PMI',
                            data: data.actualData,
                            backgroundColor: 'rgba(255, 99, 132, 0.8)',
                            borderColor: 'rgba(255, 99, 132, 1)',
                            borderWidth: 1,
                            type: 'bar'
                        },
                        {
                            label: 'Forecast',
                            data: data.forecastData,
                            borderColor: 'rgba(255, 255, 255, 1)',
                            borderWidth: 2,
                            pointBackgroundColor: 'white',
                            pointRadius: 4,
                            type: 'scatter',
                            fill: false
                        },
                        {
                            label: 'Previous Data',
                            data: data.previousData,
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 2,
                            type: 'line',
                            fill: false,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: false,
                            min: 0,
                            max: 60,
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            ticks: {
                                color: 'white'
                            }
                        },
                        x: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            ticks: {
                                color: 'white'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: 'white'
                            }
                        }
                    }
                }
            });
        }

        // Create initial chart
        createChart(initialData);

        // Handle form submission
        document.getElementById('dataForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const actualValue = parseFloat(document.getElementById('actualData').value);
            const forecastValue = parseFloat(document.getElementById('forecastData').value);
            const previousValue = parseFloat(document.getElementById('previousData').value);
            const date = new Date(document.getElementById('dateInput').value);
            const formattedDate = date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });

            // Update data
            initialData.labels.push(formattedDate);
            initialData.actualData.push(actualValue);
            initialData.forecastData.push(forecastValue);
            initialData.previousData.push(previousValue);

            // Recreate chart with new data
            createChart(initialData);

            // Reset form
            e.target.reset();
        });
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
